name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  quality-gate:
    name: Build, unit tests, and Tier A eval
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run unit tests and offline Pi Tier A stability eval
        run: npm run eval:tier-a

      - name: Verify generated output is reproducible
        run: git diff --exit-code

      # workflow_dispatch check suites are not associated with an open PR.
      # Publish the same context as a commit status after every check succeeds
      # so repository rules can recognize explicitly dispatched release PR CI.
      - name: Publish required status for dispatched CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='Build, unit tests, and Tier A eval' \
            -f description='Required CI completed via workflow_dispatch' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
